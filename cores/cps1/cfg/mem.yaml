download:
  raw_ioctl_addr: true
  post_addr: true
  post_data: true
  post_ba: true
  post_mask: true
  post_we: true

params:
  - { name: VRAM_OFFSET, value: "23'h20_0000" }
  - { name: ORAM_OFFSET, value: "23'h28_0000" }
  - { name: SND_OFFSET,  value: "23'h38_0000" }
  - { name: ROM_OFFSET,  value: "23'h00_0000" }
  - { name: SCR_OFFSET,  value: "23'h00_0000" }
  - { name: ZERO_OFFSET, value: "23'h00_0000" }
  - { name: OBJ_LATCH,  value: "1" }

sdram:
  banks:
    - buses:
      - name: workram
        addr_width: 21
        data_width: 16
        rw: true
        offset: workram_offset
      - name: vramrom
        addr_width: 18
        data_width: 16
        offset: VRAM_OFFSET
        clr: vramrom_clr
        latch: OBJ_LATCH
        double: "1"
      - name: oramrom
        when: [CPS2]
        addr_width: 14
        data_width: 16
        offset: ORAM_OFFSET
        clr: oramrom_clr
        latch: OBJ_LATCH
        double: "1"
      - name: mainrom
        addr_width: 22
        data_width: 16
        offset: ROM_OFFSET
        latch: "1"
        double: "1"
      - name: sndrom
        unless: [CPS15, CPS2]
        addr_width: 16
        data_width: 8
        offset: SND_OFFSET
        double: "0"
      - name: sndrom
        when: [CPS15, CPS2]
        addr_width: 19
        data_width: 8
        offset: SND_OFFSET
        double: "0"
    - buses:
      - name: pcmrom
        unless: [CPS15, CPS2]
        addr_width: 18
        data_width: 8
        double: "0"
      - name: pcmrom
        when: [CPS15, CPS2]
        addr_width: 23
        data_width: 8
        double: "0"
    - buses:
      - name: objlorom
        when: [CPS2]
        addr_width: 24
        data_width: 32
        latch: OBJ_LATCH
        double: "1"
    - buses:
      - name: objrom
        addr_width: 24
        data_width: 32
        offset: ZERO_OFFSET
        latch: OBJ_LATCH
        double: "1"
      - name: scrrom
        addr_width: 23
        data_width: 32
        offset: SCR_OFFSET
        double: "1"
      - name: star0rom
        when: [CPS1]
        addr_width: 23
        data_width: 32
        offset: SCR_OFFSET
        double: "0"
      - name: star1rom
        when: [CPS1]
        addr_width: 23
        data_width: 32
        offset: SCR_OFFSET
        double: "0"
