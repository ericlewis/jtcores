# Pocket target-owned metadata overrides.
#
# Use this file for Pocket packaging/scaler policy that is learned during
# hardware bring-up but should not become a scattered core-local cfg hack. Keep
# true portable core facts in cores/*/cfg, and keep HDL/fitter-only fixes in
# cores/*/pocket or cores/*/syn/pocket.qsf.
#
# Keys may be the source core name, the JT shortname without "jt", or the full
# JT shortname. Each entry must include a reason so overrides stay auditable.
cores:
  rumble:
    reason: "Local Pocket package uses a single 352x240 4:3 rot90 mode; hardware showed the generated 5:4/dual-rotation metadata starts with the wrong size/orientation."
    video:
      scaler_modes:
        - width: 352
          height: 240
          aspect_w: 4
          aspect_h: 3
          rotation: 90
          mirror: 0
  shouse:
    reason: "Local Pocket package provides explicit 288/272/256 crop modes; generated dual-mode metadata made rotation/crop selection unreliable on hardware."
    video:
      scaler_modes:
        - width: 288
          height: 224
          aspect_w: 4
          aspect_h: 3
          rotation: 0
          mirror: 0
        - width: 288
          height: 224
          aspect_w: 4
          aspect_h: 3
          rotation: 270
          mirror: 0
        - width: 288
          height: 224
          aspect_w: 4
          aspect_h: 3
          rotation: 90
          mirror: 0
        - width: 272
          height: 224
          aspect_w: 4
          aspect_h: 3
          rotation: 0
